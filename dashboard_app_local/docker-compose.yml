services:
  backend:
    build:
      context: ./backend
    container_name: pom-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/bget.db:/app/bget.db
      - ./backend/logs:/app/logs
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./electron-app
    container_name: pom-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped